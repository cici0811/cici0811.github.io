<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>英语能力证明 | 黄欣怡</title>
    <style>
      :root {
        --ink: #102033;
        --muted: #64748b;
        --blue: #1f4f8f;
        --border: rgba(15, 32, 51, 0.14);
        --bg: #fbfcfd;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
        font-size: 14px;
        line-height: 1.5;
      }

      main {
        width: min(calc(100% - 40px), 980px);
        margin: 0 auto;
        padding: 18px 0 28px;
      }

      .proof-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 18px;
        align-items: start;
      }

      figure {
        margin: 0;
        padding: 14px;
        border: 1px solid var(--border);
        background: #fff;
      }

      figcaption {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      img {
        display: block;
        width: 100%;
        height: auto;
      }

      @media (max-width: 620px) {
        main {
          width: min(calc(100vw - 28px), 420px);
          padding: 14px 0 24px;
        }

        figure {
          padding: 10px;
        }

        .proof-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="proof-grid">
        <figure>
          <figcaption>全国大学英语四级考试成绩报告单</figcaption>
          <img src="assets/proofs/cet-4-report.png" alt="全国大学英语四级考试成绩报告单">
        </figure>
        <figure>
          <figcaption>全国大学英语六级考试成绩报告单</figcaption>
          <img src="assets/proofs/cet-6-report.png" alt="全国大学英语六级考试成绩报告单">
        </figure>
      </div>
    </main>
  </body>
</html>
